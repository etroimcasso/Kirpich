name: CI

# Triggers fire on ci/** only — not main, not pull_request. Source reaches main only via
# squash-merge from a ci/<branch> that already ran green; re-running on the post-squash main
# would rebuild identical source for no new signal.
#
# Self-hosted-runner safety: there is deliberately NO pull_request-family trigger. This repo is
# public and the runners are personal machines — anyone can open a fork PR, and a pull_request
# trigger would schedule that fork's code onto them. With push-only triggers a run can be started
# only by someone who can push here. Do not add pull_request / pull_request_target / workflow_run,
# or a push trigger on main, without re-adjudicating that.
on:
  push:
    branches:
      - 'ci/**'
      # Release branches build and sign distributables in their own workflow and must NOT also run
      # the test suite — no test-result run ever lands on a release.
      - '!ci/release-artifacts-*'

# Each runner has one workspace and one fixed build directory per platform, so two runs on the same
# branch would fight over both. Superseding the older run keeps that impossible.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The engine (Polyrhythm) is consumed as a submodule. Checkout runs WITHOUT submodules and a
# following step initializes the engine with the ENGINE_PAT secret. Recursive, because the engine
# builds SDL3 and SameBoy from its own submodules. The engine repo has been PUBLIC since 2026-08-22,
# so the PAT is no longer load-bearing — it is kept because it works and removing it is a CI change
# in its own right, not a rename. The `git submodule sync` below is what carries a changed
# .gitmodules URL onto a runner whose .git/modules/engine/config still holds the old one.

jobs:

  # ── Linux x64 (beefserve) ────────────────────────────────────────────────────
  build-linux:
    name: Linux (beefserve, x64)
    runs-on: [self-hosted, Linux, X64, beefserve]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build lives at $GITHUB_WORKSPACE/build and persists between runs.
          # The checkout default runs `git clean -ffdx`, which would delete it every
          # run and silently turn the fleet cold. Windows builds outside the
          # workspace and keeps the default.
          clean: false

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # The submodule's remote is recorded in .git/modules/engine/config, NOT read from
          # .gitmodules, so a workspace cloned before the engine moved keeps fetching the old
          # remote and reports the pinned commit as a ref it does not own. sync rewrites it.
          git submodule sync --recursive -- engine
          # The credential is supplied per-invocation with -c (git passes it down to the clone it
          # spawns) rather than written to the runner's git config, so it does not persist between
          # runs. A leftover clone from an earlier run can lack the revision this branch records
          # ("Unable to find current revision"); discarding it and retrying costs a full fetch only
          # on the run that hits it.
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf "$GITHUB_WORKSPACE/.git/modules/engine"
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      # Uploaded straight after the build, so a red test run still yields a binary to look at.
      # The executable links SDL3 and SameBoy statically and nothing is laid out beside it, so it
      # travels alone; `if-no-files-found: error` makes a moved output path a loud failure rather
      # than an empty artifact. This is CI's own development configuration, NOT a distributable —
      # it carries the dev asset root, so it looks for assets in this runner's workspace.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-kirpich
          path: build/Kirpich
          if-no-files-found: error

      # The whole build directory, never just the binary — a bare binary breaks the moment
      # it needs a single file the build placed beside it. The rm clears the previous
      # staged copy, never the build itself.
      - name: Stage build for manual testing
        run: rm -rf /tmp/kirpich-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/kirpich-build

      - name: Test
        run: |
          set -o pipefail   # the default shell is `bash -e`, NOT -o pipefail: without this, tee's
                            # exit code masks a ctest failure and the gate reports green
          export SDL_VIDEODRIVER=offscreen   # headless: SDL video init must still succeed
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-test-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: ci-output/

  # ── Parser unit tests (beefserve, Linux x64) ─────────────────────────────────
  # The port-time asm parsers are pure Python (standard library only) and are not part of the C++
  # build, so they get their own job rather than riding a build. It needs no engine submodule and no
  # compiler. The end-to-end cases skip when the disassembly checkout is absent — it is never on a
  # runner (unlicensed) — leaving the helper and synthetic-fixture cases, which guard the parsers'
  # own scanning and structural-assert logic. Shares the beefserve runner with the Linux x64 build;
  # the runner serializes them, so there is no workspace contention.
  parser-tests:
    name: Parser unit tests (beefserve, Linux x64)
    runs-on: [self-hosted, Linux, X64, beefserve]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shares the workspace with the Linux x64 build on this runner; keep its persistent
          # build/ intact (see the build-linux Checkout step).
          clean: false

      - name: Run parser unit tests
        run: python3 -m unittest discover -s tools/asm_parser -p 'test_parse_*.py' -v

  # ── macOS ARM64 (ericmacmini) ────────────────────────────────────────────────
  # First of the three ARM64 jobs sharing the Apple Silicon host: native, no VM overhead.
  build-macos:
    name: macOS (ericmacmini, ARM64)
    runs-on: [self-hosted, macOS, ARM64, ericmacmini]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build lives at $GITHUB_WORKSPACE/build and persists between runs.
          # The checkout default runs `git clean -ffdx`, which would delete it every
          # run and silently turn the fleet cold. Windows builds outside the
          # workspace and keeps the default.
          clean: false

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # The submodule's remote is recorded in .git/modules/engine/config, NOT read from
          # .gitmodules, so a workspace cloned before the engine moved keeps fetching the old
          # remote and reports the pinned commit as a ref it does not own. sync rewrites it.
          git submodule sync --recursive -- engine
          # See the Linux job for why the credential is per-invocation and why the retry exists.
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf "$GITHUB_WORKSPACE/.git/modules/engine"
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      # See the Linux x64 job for what this artifact is and is not.
      #
      # A disk image, the same one the release builds, because that is how a Mac application is
      # distributed and it is what someone can actually open. Handing upload-artifact the .app
      # directly would not work: it uploads the FILES UNDER a directory, so the bundle would arrive
      # as a bare Contents/ tree with no wrapper, and it carries no permissions either, so the
      # executable inside would lose its executable bit.
      #
      # Unsigned here. Signing, notarization and stapling belong to the release workflow, which a
      # version tag starts — it builds the image with this same script, so the shape is identical.
      - name: Build the disk image
        run: |
          sh "$GITHUB_WORKSPACE/scripts/make-macos-dmg.sh" \
            "$GITHUB_WORKSPACE/build/Kirpich.app" \
            "$GITHUB_WORKSPACE/build/Kirpich-macos-arm64.dmg"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: macos-kirpich
          path: build/Kirpich-macos-arm64.dmg
          if-no-files-found: error

      # The whole build directory, never just the binary — a bare binary breaks the moment
      # it needs a single file the build placed beside it. The rm clears the previous
      # staged copy, never the build itself.
      - name: Stage build for manual testing
        run: rm -rf /tmp/kirpich-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/kirpich-build

      - name: Test
        run: |
          set -o pipefail   # see the Linux job
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/macos-test-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: ci-output/

  # ── Windows x64 (WINDOWS-BVDA56O) ────────────────────────────────────────────
  build-windows-msvc:
    name: Windows clang-cl (WINDOWS-BVDA56O, x64)
    runs-on: [self-hosted, X64, Windows, Windows_X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init engine submodule
        shell: powershell
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd $env:GITHUB_WORKSPACE
          # The submodule's remote is recorded in .git/modules/engine/config, NOT read from
          # .gitmodules, so a workspace cloned before the engine moved keeps fetching the old
          # remote and reports the pinned commit as a ref it does not own. sync rewrites it.
          git submodule sync --recursive -- engine
          # See the Linux job for why the credential is per-invocation and why the retry exists.
          git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
          if ($LASTEXITCODE -ne 0) {
            git submodule deinit -f -- engine
            Remove-Item -Recurse -Force .git\modules\engine -ErrorAction SilentlyContinue
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # ClangCL, not MSVC: SameBoy's Windows shims use #include_next, which MSVC rejects (C1021).
      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\kirpich-ci-build `
            -G "Visual Studio 17 2022" -A x64 -T ClangCL
          if ($LASTEXITCODE -ne 0) {
            # A cache written by a different generator or toolset cannot be reused, and CMake will
            # not overwrite it. Each FetchContent sub-build keeps its own cache too, so the whole
            # directory goes rather than the parts that look guilty.
            Remove-Item C:\kirpich-ci-build -Recurse -Force -ErrorAction SilentlyContinue
            cmake -S $env:GITHUB_WORKSPACE -B C:\kirpich-ci-build `
              -G "Visual Studio 17 2022" -A x64 -T ClangCL
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: powershell
        run: cmake --build C:\kirpich-ci-build --config Release --parallel

      # See the Linux x64 job for what this artifact is and is not. Two candidate paths because this
      # is a multi-configuration generator: it appends the configuration to the runtime output
      # directory the top-level CMakeLists pins. Listing both and erroring on no match means a layout
      # change is a loud failure rather than an empty artifact.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-kirpich
          path: |
            C:\kirpich-ci-build\Release\Kirpich.exe
            C:\kirpich-ci-build\src\Release\Kirpich.exe
          if-no-files-found: error

      - name: Test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\ci-output | Out-Null
          # A held handle on a fixed results name has locked this step before; write a run-unique
          # file (and best-effort clear deletable stale ones) so a stale handle cannot block it.
          Get-ChildItem C:\ci-output\windows-test-results*.txt -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          $results = "C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir C:\kirpich-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # PowerShell has no `set -o pipefail` equivalent — Tee-Object does not update
          # $LASTEXITCODE, so the cmd /c exit code is captured after the pipeline and re-raised.
          # Without this, ctest failures would silently report green.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt

  # ── Linux ARM64 (Mac Mini VM) ────────────────────────────────────────────────
  # Second ARM64 job. `needs: build-macos` serializes the Apple Silicon host, which cannot hold
  # three concurrent C++ builds. `if: always()` so an upstream failure never leaves this untested.
  build-linux-arm64:
    name: Linux (Mac Mini VM, ARM64)
    runs-on: [self-hosted, Linux, ARM64, linmac-arm64]
    needs: build-macos
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The build lives at $GITHUB_WORKSPACE/build and persists between runs.
          # The checkout default runs `git clean -ffdx`, which would delete it every
          # run and silently turn the fleet cold. Windows builds outside the
          # workspace and keeps the default.
          clean: false

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # The submodule's remote is recorded in .git/modules/engine/config, NOT read from
          # .gitmodules, so a workspace cloned before the engine moved keeps fetching the old
          # remote and reports the pinned commit as a ref it does not own. sync rewrites it.
          git submodule sync --recursive -- engine
          # See the Linux x64 job for why the credential is per-invocation and why the retry exists.
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf "$GITHUB_WORKSPACE/.git/modules/engine"
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      # See the Linux x64 job for what this artifact is and is not.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-kirpich
          path: build/Kirpich
          if-no-files-found: error

      # The whole build directory, never just the binary — a bare binary breaks the moment
      # it needs a single file the build placed beside it. The rm clears the previous
      # staged copy, never the build itself.
      - name: Stage build for manual testing
        run: rm -rf /tmp/kirpich-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/kirpich-build

      - name: Test
        run: |
          set -o pipefail   # see the Linux x64 job
          export SDL_VIDEODRIVER=offscreen
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-arm64-test-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-test-results
          path: ci-output/

  # ── Windows ARM64 (Mac Mini VM) ──────────────────────────────────────────────
  # LAST in the ARM64 chain, deliberately: it is the slowest of the three, and putting it earlier
  # would park the shorter jobs behind it. Keep it at the end if this chain is ever reshuffled.
  build-windows-arm64:
    name: Windows clang-cl (Mac Mini VM, ARM64)
    runs-on: [self-hosted, ARM64, Windows, WINMACARM64]
    needs: build-linux-arm64
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init engine submodule
        shell: powershell
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd $env:GITHUB_WORKSPACE
          # The submodule's remote is recorded in .git/modules/engine/config, NOT read from
          # .gitmodules, so a workspace cloned before the engine moved keeps fetching the old
          # remote and reports the pinned commit as a ref it does not own. sync rewrites it.
          git submodule sync --recursive -- engine
          # See the Linux x64 job for why the credential is per-invocation and why the retry exists.
          git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
          if ($LASTEXITCODE -ne 0) {
            git submodule deinit -f -- engine
            Remove-Item -Recurse -Force .git\modules\engine -ErrorAction SilentlyContinue
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\kirpich-ci-build `
            -G "Visual Studio 17 2022" -A ARM64 -T ClangCL
          if ($LASTEXITCODE -ne 0) {
            # See the Windows x64 job.
            Remove-Item C:\kirpich-ci-build -Recurse -Force -ErrorAction SilentlyContinue
            cmake -S $env:GITHUB_WORKSPACE -B C:\kirpich-ci-build `
              -G "Visual Studio 17 2022" -A ARM64 -T ClangCL
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: powershell
        run: cmake --build C:\kirpich-ci-build --config Release --parallel

      # See the Windows x64 job for the artifact's status and the two candidate paths.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-kirpich
          path: |
            C:\kirpich-ci-build\Release\Kirpich.exe
            C:\kirpich-ci-build\src\Release\Kirpich.exe
          if-no-files-found: error

      - name: Test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\ci-output | Out-Null
          # Run-unique results name — see the Windows x64 job.
          Get-ChildItem C:\ci-output\windows-arm64-test-results*.txt -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          $results = "C:\ci-output\windows-arm64-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir C:\kirpich-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # PowerShell pipefail equivalent — see the Windows x64 Test step.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-test-results
          path: C:\ci-output\windows-arm64-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt
