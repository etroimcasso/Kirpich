name: Release Artifacts

# Builds the shippable distributable on every platform and uploads ONE clean artifact per platform —
# the packaged binary, and nothing else. No tests, no test-result files: this workflow exists to
# produce the things a person downloads, so a run's artifacts are exactly the five distributables.
#
# Every job configures with KIRPICH_DEV_ASSET_ROOT=OFF so the build machine's own path is never baked
# into the binary, and then the packaging gate VERIFIES that rather than trusting the flag.
#
# Push to this branch to produce a fresh set. macOS is ad-hoc signed only here; the Developer ID
# signing and notarization that a public download needs live in the tag-triggered release workflow.
#
# Self-hosted-runner safety: no pull_request family, so a run is only startable by someone who can
# push here — the same reasoning as ci.yml.
on:
  push:
    branches:
      - 'ci/release-artifacts-0-9-0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Version guard ────────────────────────────────────────────────────────────
  # This branch is single-use: it ships one version. The branch name ends in that version
  # (ci/release-artifacts-0-9-0 -> 0.9.0), and the project's real version lives in CMakeLists.txt.
  # If they ever disagree — the classic "ran the old 0.9.0 branch after the version was bumped" —
  # every build job is blocked, so no mislabeled artifact can escape. Cut a fresh
  # ci/release-artifacts-<new-version> branch per release instead of reusing this one.
  guard-version:
    name: Guard version
    runs-on: [self-hosted, Linux, X64, beefserve]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Branch version must match the project version
        run: |
          set -eu
          branch_version="$(echo "${GITHUB_REF_NAME##*release-artifacts-}" | tr - .)"
          project_version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9.]*\).*/\1/p' \
            "$GITHUB_WORKSPACE/CMakeLists.txt" | head -1)"
          echo "branch: $branch_version   project: $project_version"
          if [ "$branch_version" != "$project_version" ]; then
            echo "error: this branch ships $branch_version but the project is $project_version." >&2
            echo "       cut ci/release-artifacts-$(echo "$project_version" | tr . -) instead." >&2
            exit 1
          fi

  # ── Linux x64 (beefserve) ────────────────────────────────────────────────────
  linux-x64:
    name: Linux x64 (beefserve)
    runs-on: [self-hosted, Linux, X64, beefserve]
    needs: guard-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git submodule sync --recursive -- engine
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf "$GITHUB_WORKSPACE/.git/modules/engine"
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Build the distributable
        run: |
          set -eu
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DKIRPICH_DEV_ASSET_ROOT=OFF -DBUILD_TESTING=OFF
          cmake --build "$GITHUB_WORKSPACE/build-release" --parallel

      - name: Stage and verify
        run: |
          set -eu
          STAGE="$GITHUB_WORKSPACE/build-release/stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE/assets/gfx/default" "$STAGE/assets/audio/default"
          touch "$STAGE/assets/gfx/default/.gitkeep" "$STAGE/assets/audio/default/.gitkeep"
          cp "$GITHUB_WORKSPACE/build-release/Kirpich" "$STAGE/Kirpich"
          sh "$GITHUB_WORKSPACE/scripts/check-distributable-clean.sh" "$STAGE" "$STAGE/Kirpich"
          cp "$STAGE/Kirpich" "$GITHUB_WORKSPACE/Kirpich-linux-x64"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kirpich-linux-x64
          path: Kirpich-linux-x64
          if-no-files-found: error

  # ── Windows x64 (WINDOWS-BVDA56O) ────────────────────────────────────────────
  windows-x64:
    name: Windows x64 (WINDOWS-BVDA56O)
    runs-on: [self-hosted, X64, Windows, Windows_X64]
    needs: guard-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init engine submodule
        shell: powershell
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd $env:GITHUB_WORKSPACE
          git submodule sync --recursive -- engine
          git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
          if ($LASTEXITCODE -ne 0) {
            git submodule deinit -f -- engine
            Remove-Item -Recurse -Force .git\modules\engine -ErrorAction SilentlyContinue
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build the distributable
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\kirpich-release-build `
            -G "Visual Studio 17 2022" -A x64 -T ClangCL `
            -DKIRPICH_DEV_ASSET_ROOT=OFF -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build C:\kirpich-release-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The dev asset root is off, so KIRPICH_PROJECT_ROOT is never defined; this confirms the
      # workspace path is not in the binary. `strings` is not on Windows, so the raw bytes are
      # searched directly.
      - name: Verify no development asset root
        shell: powershell
        run: |
          $exe = "C:\kirpich-release-build\Release\Kirpich.exe"
          $bytes = [System.IO.File]::ReadAllText($exe, [System.Text.Encoding]::ASCII)
          if ($bytes.Contains($env:GITHUB_WORKSPACE)) {
            Write-Error "binary carries a development asset root: $env:GITHUB_WORKSPACE"
            exit 1
          }
          Copy-Item $exe "$env:GITHUB_WORKSPACE\Kirpich-windows-x64.exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kirpich-windows-x64
          path: Kirpich-windows-x64.exe
          if-no-files-found: error

  # ── macOS ARM64 (ericmacmini) — first of the three ARM64 jobs on the one host ─
  # The app and the disk image are Developer ID signed, notarized and stapled here. This job refuses
  # to produce anything less: no path skips signing, so there is no un-notarized artifact to leak.
  macos-arm64:
    name: macOS ARM64 (ericmacmini)
    runs-on: [self-hosted, macOS, ARM64, ericmacmini]
    needs: guard-version
    # A step's `if` cannot read the secrets context, so the decision that depends on a secret's
    # presence is made here and read as an ordinary value below.
    env:
      HAS_IMPORTED_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git submodule sync --recursive -- engine
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf "$GITHUB_WORKSPACE/.git/modules/engine"
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Build the distributable
        run: |
          set -eu
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DKIRPICH_DEV_ASSET_ROOT=OFF -DBUILD_TESTING=OFF
          cmake --build "$GITHUB_WORKSPACE/build-release" --parallel

      - name: Stage and verify
        run: |
          set -eu
          STAGE="$GITHUB_WORKSPACE/build-release/stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE/assets/gfx/default" "$STAGE/assets/audio/default"
          touch "$STAGE/assets/gfx/default/.gitkeep" "$STAGE/assets/audio/default/.gitkeep"
          cp -R "$GITHUB_WORKSPACE/build-release/Kirpich.app" "$STAGE/Kirpich.app"
          sh "$GITHUB_WORKSPACE/scripts/check-distributable-clean.sh" "$STAGE" "$STAGE/Kirpich.app"

      # The identity is either already in this machine's login keychain (a second Developer ID cert
      # created here), or it arrives as an exported .p12 in a secret and is imported into a keychain
      # made for this run. The partition list lets codesign use an imported key without a UI prompt.
      - name: Import the signing identity
        if: env.HAS_IMPORTED_IDENTITY == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${CERTIFICATE_PASSWORD:-}" ]; then
            echo "error: MACOS_CERTIFICATE_P12 is set but MACOS_CERTIFICATE_PASSWORD is not." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/kirpich-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KIRPICH_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      # The runner is a launchd service with no logged-in session, so the login keychain — where the
      # Developer ID certificate created on this machine lives — is locked, and codesign fails with
      # errSecInternalComponent. Unlock it, and allow codesign to use the key without a UI prompt.
      - name: Unlock the keychain
        if: env.HAS_IMPORTED_IDENTITY != 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "error: MACOS_KEYCHAIN_PASSWORD is unset — the runner cannot open the login" >&2
            echo "       keychain that holds the signing key. Set it to this machine's login password." >&2
            exit 1
          fi
          KC="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null

      # Developer ID, hardened runtime, timestamped. Missing secret is a hard failure, never a
      # silent unsigned fallthrough.
      - name: Sign the app
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -eu
          if [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "error: MACOS_SIGN_IDENTITY is unset. Refusing to produce an unsigned build." >&2
            exit 1
          fi
          STAGE="$GITHUB_WORKSPACE/build-release/stage"
          if [ -n "${KIRPICH_KEYCHAIN:-}" ]; then
            codesign --force --timestamp --options runtime --keychain "$KIRPICH_KEYCHAIN" \
                     --sign "$SIGN_IDENTITY" "$STAGE/Kirpich.app"
          else
            codesign --force --timestamp --options runtime \
                     --sign "$SIGN_IDENTITY" "$STAGE/Kirpich.app"
          fi
          codesign --verify --strict --verbose=2 "$STAGE/Kirpich.app"

      - name: Notarize and staple the app
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${APPLE_ID:-}" ] || [ -z "${TEAM_ID:-}" ] || [ -z "${APP_PASSWORD:-}" ]; then
            echo "error: the MACOS_NOTARY_* secrets are unset. Refusing to produce an un-notarized build." >&2
            exit 1
          fi
          STAGE="$GITHUB_WORKSPACE/build-release/stage"
          ditto -c -k --keepParent "$STAGE/Kirpich.app" "$STAGE/Kirpich-notarize.zip"
          xcrun notarytool submit "$STAGE/Kirpich-notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple "$STAGE/Kirpich.app"
          rm -f "$STAGE/Kirpich-notarize.zip"

      # The image is signed and notarized in its own right, so the download itself opens clean, not
      # only the app inside it. The app it wraps is already stapled.
      - name: Build, sign and notarize the disk image
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -eu
          STAGE="$GITHUB_WORKSPACE/build-release/stage"
          DMG="$GITHUB_WORKSPACE/Kirpich-macOS-arm64.dmg"
          sh "$GITHUB_WORKSPACE/scripts/make-macos-dmg.sh" "$STAGE/Kirpich.app" "$DMG"
          if [ -n "${KIRPICH_KEYCHAIN:-}" ]; then
            codesign --force --timestamp --keychain "$KIRPICH_KEYCHAIN" --sign "$SIGN_IDENTITY" "$DMG"
          else
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"
          fi
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      # The check a downloader's Mac will make, made here first: this catches a signature or ticket
      # that did not actually take before the artifact is uploaded.
      - name: Verify as Gatekeeper will
        run: |
          set -eu
          spctl --assess --type execute -vv "$GITHUB_WORKSPACE/build-release/stage/Kirpich.app"
          xcrun stapler validate "$GITHUB_WORKSPACE/build-release/stage/Kirpich.app"
          xcrun stapler validate "$GITHUB_WORKSPACE/Kirpich-macOS-arm64.dmg"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kirpich-macOS-arm64
          path: Kirpich-macOS-arm64.dmg
          if-no-files-found: error

  # ── Linux ARM64 (linmac-arm64) — second on the shared host ───────────────────
  linux-arm64:
    name: Linux ARM64 (linmac-arm64)
    runs-on: [self-hosted, Linux, ARM64, linmac-arm64]
    needs: [guard-version, macos-arm64]
    # Runs after macOS whether it passed or failed (shared host), but never past a failed version guard.
    if: ${{ always() && needs.guard-version.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Init engine submodule
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git submodule sync --recursive -- engine
          if ! git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
                 submodule update --init --recursive -- engine; then
            git submodule deinit -f -- engine
            rm -rf "$GITHUB_WORKSPACE/.git/modules/engine"
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${ENGINE_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --recursive -- engine
          fi

      - name: Build the distributable
        run: |
          set -eu
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DKIRPICH_DEV_ASSET_ROOT=OFF -DBUILD_TESTING=OFF
          cmake --build "$GITHUB_WORKSPACE/build-release" --parallel

      - name: Stage and verify
        run: |
          set -eu
          STAGE="$GITHUB_WORKSPACE/build-release/stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE/assets/gfx/default" "$STAGE/assets/audio/default"
          touch "$STAGE/assets/gfx/default/.gitkeep" "$STAGE/assets/audio/default/.gitkeep"
          cp "$GITHUB_WORKSPACE/build-release/Kirpich" "$STAGE/Kirpich"
          sh "$GITHUB_WORKSPACE/scripts/check-distributable-clean.sh" "$STAGE" "$STAGE/Kirpich"
          cp "$STAGE/Kirpich" "$GITHUB_WORKSPACE/Kirpich-linux-arm64"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kirpich-linux-arm64
          path: Kirpich-linux-arm64
          if-no-files-found: error

  # ── Windows ARM64 (WINMACARM64) — last, slowest, on the shared host ──────────
  windows-arm64:
    name: Windows ARM64 (WINMACARM64)
    runs-on: [self-hosted, ARM64, Windows, WINMACARM64]
    needs: [guard-version, linux-arm64]
    # Same: serialised on the shared host, gated on the version guard.
    if: ${{ always() && needs.guard-version.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init engine submodule
        shell: powershell
        env:
          ENGINE_PAT: ${{ secrets.ENGINE_PAT }}
        run: |
          cd $env:GITHUB_WORKSPACE
          git submodule sync --recursive -- engine
          git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
          if ($LASTEXITCODE -ne 0) {
            git submodule deinit -f -- engine
            Remove-Item -Recurse -Force .git\modules\engine -ErrorAction SilentlyContinue
            git submodule sync --recursive -- engine
            git -c "url.https://x-access-token:${env:ENGINE_PAT}@github.com/.insteadOf=https://github.com/" submodule update --init --recursive -- engine
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build the distributable
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\kirpich-release-build `
            -G "Visual Studio 17 2022" -A ARM64 -T ClangCL `
            -DKIRPICH_DEV_ASSET_ROOT=OFF -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build C:\kirpich-release-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no development asset root
        shell: powershell
        run: |
          $exe = "C:\kirpich-release-build\Release\Kirpich.exe"
          $bytes = [System.IO.File]::ReadAllText($exe, [System.Text.Encoding]::ASCII)
          if ($bytes.Contains($env:GITHUB_WORKSPACE)) {
            Write-Error "binary carries a development asset root: $env:GITHUB_WORKSPACE"
            exit 1
          }
          Copy-Item $exe "$env:GITHUB_WORKSPACE\Kirpich-windows-arm64.exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kirpich-windows-arm64
          path: Kirpich-windows-arm64.exe
          if-no-files-found: error
